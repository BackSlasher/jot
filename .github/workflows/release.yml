name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Derive version from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' is not of the form vX.Y.Z"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be <= 99 for version code derivation"
            exit 1
          fi
          echo "JOT_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
          echo "JOT_VERSION_CODE=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.JOT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jot-release.jks"
          echo "JOT_KEYSTORE_FILE=$RUNNER_TEMP/jot-release.jks" >> "$GITHUB_ENV"

      - name: Test and build release APK
        working-directory: android
        env:
          JOT_KEYSTORE_PASSWORD: ${{ secrets.JOT_KEYSTORE_PASSWORD }}
          JOT_KEY_ALIAS: ${{ secrets.JOT_KEY_ALIAS }}
          JOT_KEY_PASSWORD: ${{ secrets.JOT_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify APK signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "jot-${JOT_VERSION_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "jot-${JOT_VERSION_NAME}.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
